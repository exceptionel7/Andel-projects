[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The Stripe webhook is handled by the Next.js API route at
# /api/webhooks/stripe (served by the Netlify Next.js runtime).
# Point your Stripe webhook endpoint to:
#   https://<your-site>/api/webhooks/stripe
